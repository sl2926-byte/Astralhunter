
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Defender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header>
      <h1>🚀 GALACTIC DEFENDER</h1>
      <p>Protect the galaxy. Survive the waves.</p>
    </header>

    <section class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Wave: <span id="wave">1</span></div>
      <div>Mode: <span id="mode">Campaign</span></div>
    </section>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="900" height="600"></canvas>

      <div id="overlay" class="overlay">
        <h2 id="message">GALACTIC DEFENDER</h2>
        <p id="instructions">
          Defend the galaxy from enemy spaceships!
          <br>Move with WASD or arrow keys.
          <br>Shoot with SPACE.
        </p>
        <div class="menu-buttons">
          <button id="startButton">CAMPAIGN MODE</button>
          <button id="infiniteButton">INFINITE MODE</button>
        </div>
      </div>
    </div>

    <p class="controls">
      MOVE: WASD / ARROW KEYS &nbsp; | &nbsp; SHOOT: SPACE
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
